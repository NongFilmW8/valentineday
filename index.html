<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Proposal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="welcome-message">
            <h1>สวัสดีสาวสถาปัต ฟิล์มอยากถามอะไรหน่อยย</h1>
            <button id="next-button">Next</button>
        </div>
        <div id="question" style="display: none;">
            <h2>You be my valentine🥺? มะเหมี่ยวมาเป็น valentine🥺 ของฟิล์มได้ไหมคะ</h2>
            <button id="yes-button">Yes</button>
            <button id="no-button">No</button>
        </div>
        <div id="response" style="display: none;">
            <p id="response-text"></p>
            <img id="response-image" src="" alt="" style="display: none;">
            <button id="next-question-button" style="display: none;">Next</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
